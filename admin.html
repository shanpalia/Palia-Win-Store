<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Palia Win Store — Admin</title>
  <link rel="icon" href="/Palia-Win-Store/favicon.ico">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f8fc;color:#111827}
    .top{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
    .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px}
    .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#62c7ff,#7c3aed);display:grid;place-items:center;color:#fff;font-size:13px}
    button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
    .primary{background:#111827;color:#fff}.danger{background:#fee2e2;color:#b91c1c}.muted{background:#eef2f7;color:#334155}
    .wrap{max-width:1180px;margin:0 auto;padding:30px 20px}
    .login{max-width:420px;margin:70px auto;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:30px;box-shadow:0 15px 40px #0000000b}
    h1,h2{margin-top:0}.sub{color:#64748b}
    label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}
    input,textarea,select{width:100%;padding:12px 13px;border:1px solid #d7dde7;border-radius:10px;background:#fff;outline:none;font:inherit}
    textarea{min-height:90px;resize:vertical}
    .error{color:#b91c1c;font-size:13px;margin-top:12px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}
    .stat{font-size:28px;font-weight:800;margin-top:7px}.label{font-size:13px;color:#64748b}
    .layout{display:grid;grid-template-columns:380px 1fr;gap:18px}
    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
    .app{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #eef0f4}
    .app:last-child{border-bottom:0}.app h3{margin:0 0 5px;font-size:16px}.app p{margin:0;color:#64748b;font-size:13px}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;margin-left:7px}
    .published{background:#dcfce7;color:#166534}.draft{background:#f1f5f9;color:#475569}
    .hidden{display:none!important}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}
    @media(max-width:520px){.grid{grid-template-columns:1fr}.top{padding:0 15px}.wrap{padding:20px 14px}}
  </style>
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">PW</div><span>Palia Win Store <small style="color:#64748b;font-weight:600">Admin</small></span></div>
  <button id="logoutBtn" class="muted hidden">Logout</button>
</header>

<section id="loginView" class="login">
  <h1>Admin Login</h1>
  <p class="sub">Manage published Windows applications.</p>
  <label>Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="Admin email">
  <label>Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password">
  <button id="loginBtn" class="primary" style="width:100%;margin-top:18px">Sign in</button>
  <div id="loginError" class="error"></div>
</section>

<main id="dashboardView" class="wrap hidden">
  <h1>Admin Dashboard</h1>
  <p class="sub">Windows apps, GitHub Release links and publishing.</p>

  <div class="grid">
    <div class="card"><div class="label">Total Visitors</div><div id="visitors" class="stat">—</div></div>
    <div class="card"><div class="label">Total Apps</div><div id="totalApps" class="stat">—</div></div>
    <div class="card"><div class="label">Published</div><div id="publishedApps" class="stat">—</div></div>
    <div class="card"><div class="label">Downloads</div><div id="downloads" class="stat">—</div></div>
  </div>

  <div class="layout">
    <section class="panel">
      <h2 id="formTitle">Add Windows App</h2>
      <input id="appId" type="hidden">
      <label>App Name</label>
      <input id="appName" placeholder="Example: Palia PDF Tools">
      <label>Version</label>
      <input id="version" placeholder="1.0.0">
      <label>Category</label>
      <select id="category">
        <option>Utilities</option><option>Productivity</option><option>Multimedia</option>
        <option>Tools</option><option>Games</option><option>Other</option>
      </select>
      <label>Description</label>
      <textarea id="description" placeholder="Describe the Windows app"></textarea>
      <label>GitHub Release Download URL</label>
      <input id="downloadUrl" type="url" placeholder="https://github.com/.../releases/download/.../app.exe">
      <label>App Icon URL (optional)</label>
      <input id="iconUrl" type="url" placeholder="https://...">
      <label style="display:flex;align-items:center;gap:8px;font-weight:700">
        <input id="published" type="checkbox" style="width:auto"> Publish on Store
      </label>
      <div class="actions">
        <button id="saveBtn" class="primary">Save App</button>
        <button id="clearBtn" class="muted">Clear</button>
      </div>
      <div id="formError" class="error"></div>
    </section>

    <section class="panel">
      <h2>Windows Apps</h2>
      <input id="search" placeholder="Search apps...">
      <div id="appsList" style="margin-top:10px"></div>
    </section>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCn7GUkOaFO4l0x1zM5mwW4hFkW2ISxR10",
  authDomain: "shanpalia-apk-hub.firebaseapp.com",
  projectId: "shanpalia-apk-hub",
  storageBucket: "shanpalia-apk-hub.firebasestorage.app",
  messagingSenderId: "270953807883",
  appId: "1:270953807883:web:c900f4409938f16477870e",
  measurementId: "G-7BMQEGPY8C"
};

/* Replace this with the email you actually enabled in Firebase Authentication. */
const ADMIN_EMAIL = "shanpalia786@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let allApps = [];

function showLogin(msg=""){
  $("loginView").classList.remove("hidden");
  $("dashboardView").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  $("loginError").textContent = msg;
}
function showDashboard(){
  $("loginView").classList.add("hidden");
  $("dashboardView").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
}

function clearForm(){
  $("appId").value="";
  $("appName").value="";
  $("version").value="";
  $("category").value="Utilities";
  $("description").value="";
  $("downloadUrl").value="";
  $("iconUrl").value="";
  $("published").checked=false;
  $("formTitle").textContent="Add Windows App";
  $("saveBtn").textContent="Save App";
  $("formError").textContent="";
}

function fillForm(a){
  $("appId").value=a.id;
  $("appName").value=a.name || "";
  $("version").value=a.version || "";
  $("category").value=a.category || "Utilities";
  $("description").value=a.description || "";
  $("downloadUrl").value=a.downloadUrl || a.windows_download_url || "";
  $("iconUrl").value=a.iconUrl || "";
  $("published").checked=!!a.published;
  $("formTitle").textContent="Edit Windows App";
  $("saveBtn").textContent="Update App";
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderApps(){
  const q=$("search").value.trim().toLowerCase();
  const list=allApps.filter(a=>(a.name||"").toLowerCase().includes(q));
  $("appsList").innerHTML="";
  if(!list.length){
    $("appsList").innerHTML='<p class="sub">No apps found. Add a Windows app to get started.</p>';
    return;
  }
  for(const a of list){
    const row=document.createElement("div");
    row.className="app";
    row.innerHTML=`
      <div>
        <h3>${escapeHtml(a.name||"Untitled")}
          <span class="badge ${a.published?"published":"draft"}">${a.published?"Published":"Draft"}</span>
        </h3>
        <p>${escapeHtml(a.category||"Other")} · v${escapeHtml(a.version||"—")}</p>
      </div>
      <div class="actions" style="margin:0;justify-content:flex-end">
        <button class="muted edit">Edit</button>
        <button class="danger delete">Delete</button>
      </div>`;
    row.querySelector(".edit").onclick=()=>fillForm(a);
    row.querySelector(".delete").onclick=()=>removeApp(a);
    $("appsList").appendChild(row);
  }
  $("totalApps").textContent=allApps.length;
  $("publishedApps").textContent=allApps.filter(a=>a.published).length;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

async function loadApps(){
  const snap=await getDocs(collection(db,"apps"));
  allApps=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderApps();
}

async function loadStats(){
  try{
    const snap=await getDoc(doc(db,"siteStats","global"));
    if(snap.exists()){
      const d=snap.data();
      $("visitors").textContent=d.totalVisitors ?? 0;
      $("downloads").textContent=d.totalDownloads ?? 0;
    }else{
      $("visitors").textContent="0";
      $("downloads").textContent="0";
    }
  }catch(e){
    $("visitors").textContent="—";
    $("downloads").textContent="—";
  }
}

$("loginBtn").onclick=async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  $("loginError").textContent="";
  if(!email||!password){$("loginError").textContent="Email and password are required.";return;}
  if(ADMIN_EMAIL !== "YOUR_ADMIN_EMAIL" && email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
    $("loginError").textContent="This account is not authorized as admin.";
    return;
  }
  try{await signInWithEmailAndPassword(auth,email,password);}
  catch(e){$("loginError").textContent=e.message;}
};

$("logoutBtn").onclick=()=>signOut(auth);
$("clearBtn").onclick=clearForm;
$("search").oninput=renderApps;

$("saveBtn").onclick=async()=>{
  const name=$("appName").value.trim();
  const downloadUrl=$("downloadUrl").value.trim();
  if(!name||!downloadUrl){
    $("formError").textContent="App name and GitHub Release download URL are required.";
    return;
  }
  if(!/^https:\/\/github\.com\/.+\/releases\/download\/.+/i.test(downloadUrl)){
    $("formError").textContent="Please enter a GitHub Release download URL.";
    return;
  }
  $("formError").textContent="";
  const data={
    name,
    version:$("version").value.trim(),
    category:$("category").value,
    description:$("description").value.trim(),
    downloadUrl,
    windows_download_url:downloadUrl,
    iconUrl:$("iconUrl").value.trim(),
    published:$("published").checked,
    platform:"Windows",
    updatedAt:new Date().toISOString()
  };
  try{
    if($("appId").value){
      await updateDoc(doc(db,"apps",$("appId").value),data);
    }else{
      data.createdAt=new Date().toISOString();
      await addDoc(collection(db,"apps"),data);
    }
    clearForm();
    await loadApps();
  }catch(e){
    $("formError").textContent=e.message;
  }
};

async function removeApp(a){
  if(!confirm(`Delete "${a.name}"?`)) return;
  try{
    await deleteDoc(doc(db,"apps",a.id));
    await loadApps();
  }catch(e){alert(e.message);}
}

onAuthStateChanged(auth,async user=>{
  if(!user){showLogin();return;}
  if(ADMIN_EMAIL !== "YOUR_ADMIN_EMAIL" && user.email?.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
    await signOut(auth);
    showLogin("This account is not authorized as admin.");
    return;
  }
  showDashboard();
  await Promise.all([loadApps(),loadStats()]);
});
</script>
</body>
</html>
