<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palia Win Store — Admin Login</title><link rel="icon" href="favicon.ico">
<style>
.pws-header{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:10}
.pws-menu{width:44px;height:44px;border:0;border-radius:11px;background:#eef2f7;cursor:pointer;font-size:23px;display:grid;place-items:center;flex:none}
.pws-brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#111827}
.pws-brand img{width:40px;height:40px;object-fit:contain;display:block;border-radius:10px}
.pws-brand-text{display:flex;flex-direction:column;line-height:1.02}
.pws-brand-name{font-size:18px;font-weight:850;letter-spacing:-.2px}
.pws-brand-name .win{color:#118bd2}
.pws-brand-by{font-size:8px;font-weight:700;color:#64748b;letter-spacing:.35px;margin-top:4px}
.pws-side{position:fixed;left:0;top:0;bottom:0;width:270px;background:#fff;border-right:1px solid #e5e7eb;z-index:100;padding:18px 14px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:12px 0 35px transparent}
.pws-side.open{transform:translateX(0);box-shadow:12px 0 35px rgba(0,0,0,.12)}
.pws-side-head{display:flex;align-items:center;gap:9px;padding:2px 8px 15px;border-bottom:1px solid #eef2f7;margin-bottom:12px}
.pws-side-head img{width:40px;height:40px;object-fit:contain;border-radius:10px}
.pws-side-head .name{font-size:16px;font-weight:850}.pws-side-head .by{font-size:7px;color:#64748b;font-weight:700;display:block;margin-top:3px}
.pws-close{margin-left:auto;width:34px;height:34px;border:0;border-radius:9px;background:#eef2f7;font-size:20px;cursor:pointer}
.pws-nav{width:100%;border:0;background:transparent;text-align:left;padding:13px 12px;border-radius:10px;cursor:pointer;font:inherit;font-weight:650;color:#334155;margin:2px 0}
.pws-nav:hover{background:#f1f5f9}.pws-nav.logout{color:#b91c1c}
.pws-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90}.pws-overlay.show{display:block}
</style>

<style>
body{margin:0;background:#f6f8fc;color:#111827;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.login{max-width:420px;margin:70px auto;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:30px;box-shadow:0 15px 40px #0000000b}h1{margin-top:0}.sub{color:#64748b}label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}input{width:100%;padding:12px;border:1px solid #d7dde7;border-radius:10px;font:inherit}.btn{width:100%;margin-top:18px;border:0;border-radius:10px;padding:12px;background:#111827;color:#fff;font-weight:750;cursor:pointer}.error{color:#b91c1c;font-size:13px;margin-top:12px}
</style></head><body>
<aside id="pwsSide" class="pws-side">
  <div class="pws-side-head">
    <img src="assets/palia-win-store-icon.png" alt="">
    <div><div class="name">Palia Win Store</div><span class="by">BY SHANPALIA</span></div>
    <button id="pwsClose" class="pws-close" aria-label="Close menu">×</button>
  </div>
  <button class="pws-nav" id="pwsHome">🏠 Home</button>
  <button class="pws-nav" id="pwsDashboard">📊 Dashboard</button>
  <button class="pws-nav" id="pwsAdd">➕ Add App</button>
  <button class="pws-nav" id="pwsManage">📦 Manage App</button>
  <button class="pws-nav logout" id="pwsLogout">🚪 Logout</button>
</aside>
<div id="pwsOverlay" class="pws-overlay"></div>

<header class="pws-header"><button id="pwsMenu" class="pws-menu" aria-label="Open menu">☰</button>
<a class="pws-brand" href="index.html"><img src="assets/palia-win-store-icon.png" alt=""><span class="pws-brand-text"><span class="pws-brand-name">Palia <span class="win">Win Store</span></span><span class="pws-brand-by">BY SHANPALIA</span></span></a></header>
<section class="login"><h1>Admin Login</h1><p class="sub">Sign in to manage Palia Win Store.</p><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Admin email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn" class="btn">Sign in</button><div id="error" class="error"></div></section>

<script>
(function(){
  const side=document.getElementById("pwsSide"), overlay=document.getElementById("pwsOverlay");
  const open=()=>{if(side){side.classList.add("open");overlay&&overlay.classList.add("show")}};
  const close=()=>{if(side){side.classList.remove("open");overlay&&overlay.classList.remove("show")}};
  const bind=(id,fn)=>{const e=document.getElementById(id);if(e)e.addEventListener("click",fn)};
  bind("pwsMenu",open); bind("pwsClose",close); bind("pwsOverlay",close);
  bind("pwsHome",()=>{sessionStorage.removeItem("pws_admin_session");location.href="index.html"});
  bind("pwsDashboard",()=>location.href="dashboard.html");
  bind("pwsAdd",()=>location.href="add-app.html");
  bind("pwsManage",()=>location.href="manage-app.html");
  bind("pwsLogout",()=>{sessionStorage.removeItem("pws_admin_session");location.href="admin.html"});
})();
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
const app=initializeApp({apiKey:"AIzaSyCn7GUkOaFO4l0x1zM5mwW4hFkW2ISxR10",authDomain:"shanpalia-apk-hub.firebaseapp.com",projectId:"shanpalia-apk-hub",storageBucket:"shanpalia-apk-hub.firebasestorage.app",messagingSenderId:"270953807883",appId:"1:270953807883:web:c900f4409938f16477870e"}),auth=getAuth(app),ADMIN_EMAIL="YOUR_ADMIN_EMAIL";
loginBtn.onclick=async()=>{error.textContent="";loginBtn.disabled=true;try{const c=await signInWithEmailAndPassword(auth,email.value.trim(),password.value);if(ADMIN_EMAIL!=="YOUR_ADMIN_EMAIL"&&c.user.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await signOut(auth);throw Error("This account is not authorized as admin.")}location.href="dashboard.html"}catch(e){error.textContent=e.message}finally{loginBtn.disabled=false}};
onAuthStateChanged(auth,user=>{if(user){if(ADMIN_EMAIL==="YOUR_ADMIN_EMAIL"||user.email?.toLowerCase()===ADMIN_EMAIL.toLowerCase())location.href="dashboard.html"}});
</script></body></html>
