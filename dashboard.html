<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palia Win Store — Admin Dashboard</title>
<link rel="icon" href="assets/palia-win-store-icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f6f8fc;color:#111827}
.top{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:10}
.menu{width:44px;height:44px;border:0;border-radius:11px;background:#eef2f7;cursor:pointer;font-size:24px;display:grid;place-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.brand img{width:38px;height:38px;border-radius:11px}.brand small{font-size:12px;color:#64748b;font-weight:600}
.side{position:fixed;left:0;top:0;bottom:0;width:270px;background:#fff;border-right:1px solid #e5e7eb;z-index:30;padding:18px 14px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:12px 0 35px #0000}.side.open{transform:translateX(0);box-shadow:12px 0 35px #0002}
.side-head{height:55px;display:flex;align-items:center;gap:10px;padding:0 8px 15px;border-bottom:1px solid #eef2f7;margin-bottom:12px}.side-head img{width:38px;height:38px;border-radius:11px}.side-head strong{font-size:16px}.close{margin-left:auto;border:0;background:#eef2f7;border-radius:9px;width:34px;height:34px;font-size:20px;cursor:pointer}
.nav{width:100%;border:0;background:transparent;text-align:left;padding:13px 12px;border-radius:10px;cursor:pointer;font:inherit;font-weight:650;color:#334155;margin:2px 0}.nav:hover{background:#f1f5f9}.nav.logout{color:#b91c1c}
.overlay{display:none;position:fixed;inset:0;background:#0004;z-index:25}.overlay.show{display:block}
.wrap{max-width:1200px;margin:auto;padding:30px 20px}.sub{color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}.label{font-size:13px;color:#64748b}.stat{font-size:30px;font-weight:800;margin-top:7px}
.panel{margin-top:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.panel h2{margin:0}.search{margin-top:15px}
input{width:100%;padding:12px 13px;border:1px solid #d7dde7;border-radius:10px;background:#fff;font:inherit;outline:none}
.app{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 0;border-bottom:1px solid #eef0f4}.app:last-child{border-bottom:0}.app h3{margin:0 0 5px;font-size:16px}.app p{margin:0;color:#64748b;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;margin-left:7px}.published{background:#dcfce7;color:#166534}.draft{background:#f1f5f9;color:#475569}
.actions{display:flex;gap:7px}.icon-btn{width:40px;height:40px;border:0;border-radius:10px;background:#eef2f7;cursor:pointer;font-size:17px}.icon-btn.delete{background:#fee2e2;color:#b91c1c}
.primary{border:0;border-radius:10px;padding:11px 15px;background:#111827;color:#fff;font-weight:750;cursor:pointer}.danger{border:0;border-radius:10px;padding:10px 14px;background:#fee2e2;color:#b91c1c;font-weight:750;cursor:pointer}
.loading{text-align:center;padding:50px;color:#64748b}.hidden{display:none!important}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px}.app{align-items:flex-start}.top{padding:0 14px}.brand small{display:none}}
</style>
</head>
<body>
<aside id="side" class="side">
  <div class="side-head"><img src="assets/palia-win-store-icon.svg" alt=""><strong>Palia Win Store</strong><button id="close" class="close">×</button></div>
  <button class="nav" id="homeBtn">🏠 Home</button>
  <button class="nav" id="dashboardBtn">📊 Dashboard</button>
  <button class="nav" id="addBtn">➕ Add App</button>
  <button class="nav" id="manageBtn">📦 Manage App</button>
  <button class="nav logout" id="sideLogout">🚪 Logout</button>
</aside>
<div id="overlay" class="overlay"></div>
<header class="top">
  <button id="menu" class="menu" aria-label="Open menu">☰</button>
  <div class="brand"><img src="assets/palia-win-store-icon.svg" alt=""><span>Palia Win Store <small>Admin Dashboard</small></span></div>
</header>
<main id="loading" class="wrap"><div class="loading">Checking admin access…</div></main>
<main id="dashboard" class="wrap hidden">
  <h1>Dashboard</h1><p class="sub">Manage your Windows applications and store statistics.</p>
  <div class="grid">
    <div class="card"><div class="label">Total Visitors</div><div id="visitors" class="stat">—</div></div>
    <div class="card"><div class="label">Total Apps</div><div id="totalApps" class="stat">0</div></div>
    <div class="card"><div class="label">Published</div><div id="publishedApps" class="stat">0</div></div>
    <div class="card"><div class="label">Downloads</div><div id="downloads" class="stat">—</div></div>
  </div>
  <section class="panel">
    <div class="panel-head"><div><h2>App List</h2><p class="sub" style="margin:6px 0 0">Your actual Firestore Windows apps</p></div><button id="addTop" class="primary">＋ Add App</button></div>
    <div class="search"><input id="search" placeholder="Search apps..."></div>
    <div id="list"></div>
  </section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,deleteDoc,doc,getDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCn7GUkOaFO4l0x1zM5mwW4hFkW2ISxR10",authDomain:"shanpalia-apk-hub.firebaseapp.com",projectId:"shanpalia-apk-hub",storageBucket:"shanpalia-apk-hub.firebasestorage.app",messagingSenderId:"270953807883",appId:"1:270953807883:web:c900f4409938f16477870e",measurementId:"G-7BMQEGPY8C"};
const ADMIN_EMAIL="YOUR_ADMIN_EMAIL";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);let apps=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function openMenu(){$("side").classList.add("open");$("overlay").classList.add("show")}
function closeMenu(){$("side").classList.remove("open");$("overlay").classList.remove("show")}
$("menu").onclick=openMenu;$("close").onclick=closeMenu;$("overlay").onclick=closeMenu;
$("homeBtn").onclick=async()=>{await signOut(auth);location.href="index.html"};
$("dashboardBtn").onclick=()=>{closeMenu();location.href="dashboard.html"};
$("addBtn").onclick=()=>location.href="add-app.html";
$("manageBtn").onclick=()=>location.href="manage-app.html";
async function logout(){await signOut(auth);location.href="admin.html"}$("sideLogout").onclick=logout;
$("addTop").onclick=()=>location.href="add-app.html";
async function load(){
 const snap=await getDocs(collection(db,"apps"));apps=snap.docs.map(d=>({id:d.id,...d.data()}));render();
 try{const st=await getDoc(doc(db,"siteStats","global"));const d=st.exists()?st.data():{};$("visitors").textContent=d.totalVisitors??0;$("downloads").textContent=d.totalDownloads??0}catch{$("visitors").textContent="—";$("downloads").textContent="—"}
}
function render(){
 const q=$("search").value.trim().toLowerCase(),rows=apps.filter(a=>(a.name||"").toLowerCase().includes(q));
 $("totalApps").textContent=apps.length;$("publishedApps").textContent=apps.filter(a=>a.published).length;
 $("list").innerHTML=rows.length?rows.map(a=>`<div class="app"><div><h3>${esc(a.name||"Untitled")} <span class="badge ${a.published?"published":"draft"}">${a.published?"Published":"Draft"}</span></h3><p>${esc(a.category||"Other")} · v${esc(a.version||"—")}</p></div><div class="actions"><button class="icon-btn" title="Edit" data-edit="${a.id}">✏️</button><button class="icon-btn delete" title="Delete" data-del="${a.id}">🗑️</button></div></div>`).join(""):'<p class="sub">No apps published or saved yet.</p>';
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>location.href="edit-app.html?id="+encodeURIComponent(b.dataset.edit));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const a=apps.find(x=>x.id===b.dataset.del);if(!confirm("Delete "+(a?.name||"this app")+"?"))return;try{await deleteDoc(doc(db,"apps",b.dataset.del));await load()}catch(e){alert(e.message)}});
}
$("search").oninput=render;
onAuthStateChanged(auth,async user=>{
 if(!user){location.href="admin.html";return}
 if(ADMIN_EMAIL!=="YOUR_ADMIN_EMAIL"&&user.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await signOut(auth);location.href="admin.html";return}
 $("loading").classList.add("hidden");$("dashboard").classList.remove("hidden");
 try{await load()}catch(e){$("list").innerHTML='<p class="sub">Unable to load apps: '+esc(e.message)+'</p>'}
});
</script>
</body></html>
