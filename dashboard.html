<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palia Win Store — Admin Dashboard</title>
<link rel="icon" href="/Palia-Win-Store/favicon.ico">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f8fc;color:#111827}
.top{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px}.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#62c7ff,#7c3aed);display:grid;place-items:center;color:#fff;font-size:13px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.danger{background:#fee2e2;color:#b91c1c}.muted{background:#eef2f7;color:#334155}
.wrap{max-width:1180px;margin:auto;padding:30px 20px}.sub{color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}
.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}.label{font-size:13px;color:#64748b}.stat{font-size:28px;font-weight:800;margin-top:7px}
.layout{display:grid;grid-template-columns:380px 1fr;gap:18px}.panel h2{margin-top:0}label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid #d7dde7;border-radius:10px;background:#fff;outline:none;font:inherit}textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.error{color:#b91c1c;font-size:13px;margin-top:12px}
.app{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #eef0f4}.app:last-child{border-bottom:0}
.app h3{margin:0 0 5px;font-size:16px}.app p{margin:0;color:#64748b;font-size:13px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;margin-left:7px}.published{background:#dcfce7;color:#166534}.draft{background:#f1f5f9;color:#475569}
.hidden{display:none!important}.top-actions{display:flex;gap:8px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.top{padding:0 15px}.wrap{padding:20px 14px}}

  .logo-img{width:38px;height:38px;border-radius:11px;display:block}

</style>
</head>

<body>
<style>
  .dash-shell{display:flex;min-height:100vh}
  .side{width:255px;background:#fff;border-right:1px solid #e5e7eb;padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:.22s}
  .side.open{transform:translateX(0);box-shadow:12px 0 35px #0001}
  .side .brand{display:flex;align-items:center;gap:10px;padding:8px 10px 24px;font-weight:800}
  .side .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#62c7ff,#7c3aed);display:grid;place-items:center;color:#fff;font-size:12px}
  .navbtn{width:100%;background:transparent;text-align:left;color:#334155;margin:3px 0;padding:13px 12px;border-radius:10px}
  .navbtn:hover{background:#f1f5f9}.navbtn.logout{color:#b91c1c}
  .menu-close{float:right;background:#f1f5f9;padding:7px 10px}
  .overlay{position:fixed;inset:0;background:#0004;z-index:15;display:none}.overlay.show{display:block}
  .main{width:100%}
  .top{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:10}
  .hamb{font-size:24px;background:#eef2f7;padding:7px 11px}
  .top-title{font-weight:800;font-size:19px}.spacer{flex:1}
  .wrap{max-width:1200px;margin:auto;padding:28px 20px}
  .sub{color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}
  .card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}
  .label{font-size:13px;color:#64748b}.stat{font-size:29px;font-weight:800;margin-top:7px}
  .panel{margin-top:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .app{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #eef0f4}
  .app:last-child{border-bottom:0}.app h3{margin:0 0 5px;font-size:16px}.app p{margin:0;color:#64748b;font-size:13px}
  .badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;margin-left:7px}
  .published{background:#dcfce7;color:#166534}.draft{background:#f1f5f9;color:#475569}
  .icon-btn{width:38px;height:38px;padding:0;border-radius:9px;background:#eef2f7;font-size:17px}
  .icon-btn.delete{background:#fee2e2;color:#b91c1c}.actions{display:flex;gap:7px}
  input,textarea,select{width:100%;padding:12px;border:1px solid #d7dde7;border-radius:10px;font:inherit}
  .formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:10px 0}.field.full{grid-column:1/-1}
  .primary{background:#111827;color:#fff}.muted{background:#eef2f7;color:#334155}.danger{background:#fee2e2;color:#b91c1c}
  .hidden{display:none!important}
  @media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  @media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px}}
</style>

<div id="loginGate" class="hidden"></div>
<div class="dash-shell">
  <aside id="side" class="side">
    <div class="brand"><img class="logo-img" src="assets/palia-win-store-icon.svg" alt="Palia Win Store"><span>Palia Win Store</span><button id="closeMenu" class="menu-close">×</button></div>
    <button class="navbtn" id="homeBtn">🏠 Home</button>
    <button class="navbtn" onclick="location.href='dashboard.html'">📊 Dashboard</button>
    <button class="navbtn" onclick="location.href='add-app.html'">➕ Add App</button>
    <button class="navbtn" onclick="location.href='manage-app.html'">📦 Manage App</button>
    <button id="sideLogout" class="navbtn logout">🚪 Logout</button>
  </aside>
  <div id="overlay" class="overlay"></div>

  <div class="main">
    <header class="top">
      <button id="hamb" class="hamb" aria-label="Open menu">☰</button>
      <div class="top-title">Palia Win Store <span style="font-size:13px;color:#64748b;font-weight:600">Admin Dashboard</span></div>
      <div class="spacer"></div>
      <button id="topLogout" class="danger">Logout</button>
    </header>

    <main id="loading" class="wrap"><p class="sub">Checking admin access…</p></main>

    <main id="dashboard" class="wrap hidden">
      <h1>Dashboard</h1>
      <p class="sub">Manage your Windows applications and store statistics.</p>

      <div class="grid">
        <div class="card"><div class="label">Total Visitors</div><div id="visitors" class="stat">—</div></div>
        <div class="card"><div class="label">Total Apps</div><div id="totalApps" class="stat">0</div></div>
        <div class="card"><div class="label">Published</div><div id="publishedApps" class="stat">0</div></div>
        <div class="card"><div class="label">Downloads</div><div id="downloads" class="stat">—</div></div>
      </div>

      <section class="panel">
        <div class="panel-head">
          <div><h2 style="margin:0">App List</h2><p class="sub" style="margin:6px 0 0">Published and draft Windows apps</p></div>
          <button class="primary" onclick="location.href='add-app.html'">＋ Add App</button>
        </div>
        <div style="margin-top:15px"><input id="search" placeholder="Search apps..."></div>
        <div id="list"></div>
      </section>
    </main>
  </div>
</div>


<script>
(function(){
  const side=document.getElementById("side");
  const overlay=document.getElementById("overlay");
  const hamb=document.getElementById("hamb");
  const close=document.getElementById("closeMenu");
  function openMenu(){side.classList.add("open");overlay.classList.add("show");}
  function closeMenu(){side.classList.remove("open");overlay.classList.remove("show");}
  if(hamb) hamb.addEventListener("click",openMenu);
  if(close) close.addEventListener("click",closeMenu);
  if(overlay) overlay.addEventListener("click",closeMenu);
})();
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,getDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCn7GUkOaFO4l0x1zM5mwW4hFkW2ISxR10",
 authDomain:"shanpalia-apk-hub.firebaseapp.com",
 projectId:"shanpalia-apk-hub",
 storageBucket:"shanpalia-apk-hub.firebasestorage.app",
 messagingSenderId:"270953807883",
 appId:"1:270953807883:web:c900f4409938f16477870e",
 measurementId:"G-7BMQEGPY8C"
};
const ADMIN_EMAIL="YOUR_ADMIN_EMAIL";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let apps=[];

const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function clearForm(){
 ["appId","appName","version","description","downloadUrl","iconUrl"].forEach(id=>$(id).value="");
 $("category").value="Utilities";$("published").checked=false;$("formTitle").textContent="Add Windows App";$("save").textContent="Save App";$("formError").textContent="";
}
function fill(a){
 $("appId").value=a.id;$("appName").value=a.name||"";$("version").value=a.version||"";$("category").value=a.category||"Utilities";
 $("description").value=a.description||"";$("downloadUrl").value=a.downloadUrl||a.windows_download_url||"";$("iconUrl").value=a.iconUrl||"";$("published").checked=!!a.published;
 $("formTitle").textContent="Edit Windows App";$("save").textContent="Update App";scrollTo({top:0,behavior:"smooth"});
}
function render(){
 const q=$("search").value.toLowerCase().trim(), rows=apps.filter(a=>(a.name||"").toLowerCase().includes(q));
 $("totalApps").textContent=apps.length;$("publishedApps").textContent=apps.filter(a=>a.published).length;
 $("list").innerHTML=rows.length?rows.map(a=>`
 <div class="app"><div><h3>${esc(a.name)} <span class="badge ${a.published?"published":"draft"}">${a.published?"Published":"Draft"}</span></h3>
 <p>${esc(a.category||"Other")} · v${esc(a.version||"—")}</p></div>
 <div class="actions" style="margin:0"><button class="muted" data-edit="${a.id}">Edit</button><button class="danger" data-del="${a.id}">Delete</button></div></div>`).join(""):'<p class="sub">No apps yet.</p>';
 document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>location.href="edit-app.html?id="+encodeURIComponent(b.dataset.edit));
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>remove(b.dataset.del));
}
async function load(){
 const snap=await getDocs(collection(db,"apps"));apps=snap.docs.map(d=>({id:d.id,...d.data()}));render();
 try{const s=await getDoc(doc(db,"siteStats","global"));const d=s.exists()?s.data():{};$("visitors").textContent=d.totalVisitors??0;$("downloads").textContent=d.totalDownloads??0;}catch{$("visitors").textContent="—";$("downloads").textContent="—";}
}
async function remove(id){const a=apps.find(x=>x.id===id);if(!confirm("Delete "+(a?.name||"this app")+"?"))return;try{await deleteDoc(doc(db,"apps",id));await load();}catch(e){alert(e.message)}}

async function doLogout(){
  try{ await signOut(auth); }
  finally{ window.location.href="admin.html"; }
}
$("topLogout").onclick=doLogout;
$("sideLogout").onclick=doLogout;
$("homeBtn").onclick=async()=>{
  try{ await signOut(auth); }
  finally{ window.location.href="index.html"; }
};

$("search").oninput=render;

onAuthStateChanged(auth,async user=>{
 if(!user){location.href="admin.html";return}
 if(ADMIN_EMAIL!=="YOUR_ADMIN_EMAIL"&&user.email?.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await signOut(auth);location.href="admin.html";return}
 $("loading").classList.add("hidden");$("dashboard").classList.remove("hidden");await load();
});
</script>
</body>
</html>
