<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palia Win Store — Edit App</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#111827;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.top{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 22px}.wrap{max-width:850px;margin:auto;padding:28px 20px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:22px;margin-bottom:16px}label{display:block;font-size:13px;font-weight:750;margin:15px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid #d7dde7;border-radius:10px;background:#fff;font:inherit}textarea{min-height:120px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.muted{color:#64748b}.btn{border:0;border-radius:10px;padding:12px 16px;background:#111827;color:#fff;font-weight:750;cursor:pointer}.notice{padding:12px;border-radius:10px;background:#f1f5f9;color:#475569;white-space:pre-wrap}.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{padding:18px 12px}}
</style></head><body>
<header class="top"><strong>✏️ Palia Win Store — Edit App</strong><a style="margin-left:auto;color:#334155" href="manage-app.html">Manage Apps</a></header>
<main class="wrap"><h1>Edit Windows App</h1><p class="muted">Leave image fields empty to keep the current images.</p><div id="msg" class="notice">Checking admin access…</div>
<form id="form" class="panel" hidden>
<div class="grid">
<div><label for="name">App Name *</label><input id="name" required></div><div><label for="version">Version *</label><input id="version" required></div>
<div><label for="category">Category</label><input id="category"></div><div><label for="developer">Developer</label><input id="developer"></div>
<div class="full"><label for="tagline">Tagline</label><input id="tagline"></div>
<div class="full"><label for="description">Description</label><textarea id="description"></textarea></div>
<div class="full"><label for="releaseUrl">GitHub Release download URL *</label><input id="releaseUrl" type="url" required></div>
<div><label for="icon">Replace app icon URL (optional)</label><input id="icon" type="url" placeholder="https://raw.githubusercontent.com/OWNER/REPO/main/icon.png"></div>
<div><label for="banner">Replace banner URL (optional)</label><input id="banner" type="url" placeholder="https://raw.githubusercontent.com/OWNER/REPO/main/banner.png"></div>
<div class="full"><label for="screenshots">Screenshot URLs (optional, one HTTPS URL per line, up to 5)</label><textarea id="screenshots" placeholder="https://raw.githubusercontent.com/OWNER/REPO/main/screenshot1.png"></textarea></div>
<div class="full"><label><input id="published" type="checkbox" style="width:auto"> Published on public storefront</label></div>
</div><button class="btn" id="save" type="submit">Save Changes</button>
</form></main>
<script type="module">
import { doc,getDoc,updateDoc,serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { auth,db,requireConfiguredAdmin } from "./pws-firebase.js";
import { APPS_COLLECTION } from "./pws-config.js";
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get("id");
const msg=$("msg"),form=$("form");let current=null;
const show=(t,type="")=>{msg.hidden=false;msg.className="notice "+type;msg.textContent=t};
const validImageUrl=value=>{if(!value)return true;try{return new URL(value).protocol==="https:"}catch{return false}};
const validReleaseUrl=value=>/^https:\/\/github\.com\/[^/]+\/[^/]+\/releases\/download\/[^/]+\/.+\.(exe|msi|zip)(\?.*)?$/i.test(value);
async function load(){if(!id)throw new Error("Missing app ID.");const snap=await getDoc(doc(db,APPS_COLLECTION,id));if(!snap.exists())throw new Error("This app could not be found.");current=snap.data();["name","version","category","developer","tagline","description","releaseUrl"].forEach(k=>$(k).value=current[k]||"");$("published").checked=!!current.published;$("icon").value="";$("banner").value="";$("screenshots").value=(current.screenshots||[]).join("\n");form.hidden=false;msg.hidden=true}
form.onsubmit=async e=>{e.preventDefault();const button=$("save");button.disabled=true;button.textContent="Saving…";try{
const releaseUrl=$("releaseUrl").value.trim();if(!validReleaseUrl(releaseUrl))throw new Error("Use a direct GitHub Release URL for an .exe, .msi, or .zip file.");
const icon=$("icon").value.trim(),banner=$("banner").value.trim(),screenshots=$("screenshots").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,5);
if(![icon,banner,...screenshots].every(validImageUrl))throw new Error("Image links must be valid HTTPS URLs.");
const patch={name:$("name").value.trim(),version:$("version").value.trim(),category:$("category").value.trim(),developer:$("developer").value.trim(),tagline:$("tagline").value.trim(),description:$("description").value.trim(),releaseUrl,published:$("published").checked,updatedAt:serverTimestamp()};
if(icon)patch.iconUrl=icon;if(banner)patch.bannerUrl=banner;patch.screenshots=screenshots;await updateDoc(doc(db,APPS_COLLECTION,id),patch);show("App updated successfully.","success");setTimeout(()=>location.href="manage-app.html",900)
}catch(e){show(e.message||"Could not update app.","error");button.disabled=false;button.textContent="Save Changes"}};
onAuthStateChanged(auth,async user=>{try{requireConfiguredAdmin(user);await load()}catch(e){show(e.message,"error")}});
</script></body></html>
