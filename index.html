<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palia Win Store</title>
    <meta name="description" content="Palia Win Store — Your Windows Apps Store" />
    <meta property="og:title" content="Palia Win Store" />
    <meta property="og:description" content="Palia Win Store — Your Windows Apps Store" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/Palia-Win-Store/favicon.ico" />

    <!-- Hidden Admin: 5 quick clicks on the Palia Win Store logo/name -->
    <script>
      (function () {
        let count = 0;
        let resetTimer = null;

        function isBrandClick(target) {
          let el = target;
          for (let i = 0; el && i < 8; i++, el = el.parentElement) {
            const text = (el.textContent || "").replace(/\s+/g, " ").trim();

            // The header/brand normally contains the exact store name.
            if (/^Palia\s+Win\s+Store(?:\s+.*)?$/i.test(text) && text.length <= 100) {
              return true;
            }

            // Also accept common branding/header/logo selectors.
            if (
              el.matches &&
              el.matches(
                '[aria-label*="Palia" i], [title*="Palia" i], ' +
                '[class*="brand" i], [class*="logo" i], header'
              )
            ) {
              return true;
            }
          }
          return false;
        }

        document.addEventListener("click", function (event) {
          if (!isBrandClick(event.target)) return;

          count++;
          clearTimeout(resetTimer);

          resetTimer = setTimeout(function () {
            count = 0;
          }, 2500);

          if (count === 5) {
            count = 0;
            clearTimeout(resetTimer);
            window.location.assign("/Palia-Win-Store/admin.html");
          }
        }, true);
      })();
    </script>

    <script type="module" crossorigin src="/Palia-Win-Store/assets/index-3zhsoKXn.js"></script>
    <link rel="stylesheet" crossorigin href="/Palia-Win-Store/assets/index-DBtPLB31.css">
  </head>

  </body>
</html>
