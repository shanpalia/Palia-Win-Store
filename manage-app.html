<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palia Win Store — Manage Apps</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#111827;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.top{height:70px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 22px;gap:14px}.brand{font-weight:850;font-size:18px}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}.sub{color:#64748b}.app{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;border-bottom:1px solid #eef2f7}.app:last-child{border:0}.name{font-weight:800}.meta{font-size:13px;color:#64748b;margin-top:5px}.badge{display:inline-block;font-size:11px;font-weight:800;padding:4px 8px;border-radius:20px;margin-left:8px}.published{background:#dcfce7;color:#166534}.draft{background:#f1f5f9;color:#475569}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 12px;background:#111827;color:#fff;font-weight:750;cursor:pointer}.light{background:#eef2f7;color:#334155}.danger{background:#fee2e2;color:#b91c1c}.notice{padding:12px;border-radius:10px;background:#f1f5f9;color:#475569;white-space:pre-wrap}.error{background:#fee2e2;color:#991b1b}@media(max-width:600px){.app{align-items:flex-start;flex-direction:column}.wrap{padding:18px 12px}}
</style></head><body>
<header class="top"><div class="brand">📦 Palia Win Store — Manage Apps</div><a style="margin-left:auto;color:#334155" href="dashboard.html">Dashboard</a></header>
<main class="wrap"><h1>Manage Apps</h1><p class="sub">Edit app details, publish drafts, or remove an app from the store.</p><div id="message" class="notice">Checking admin access…</div><section id="panel" class="panel" hidden><div id="list"></div></section></main>
<script type="module">
import { collection,getDocs,doc,deleteDoc,updateDoc } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { auth,db,requireConfiguredAdmin } from "./pws-firebase.js";
import { APPS_COLLECTION } from "./pws-config.js";
const message=document.getElementById("message"),panel=document.getElementById("panel"),list=document.getElementById("list");
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function load(){const snap=await getDocs(collection(db,APPS_COLLECTION));const apps=snap.docs.map(d=>({id:d.id,...d.data()}));list.innerHTML=apps.length?apps.map(a=>'<article class="app"><div><div class="name">'+esc(a.name||"Untitled")+' <span class="badge '+(a.published?"published":"draft")+'">'+(a.published?"Published":"Draft")+'</span></div><div class="meta">'+esc(a.category||"Other")+' · v'+esc(a.version||"—")+'</div></div><div class="actions"><button class="btn light" data-edit="'+esc(a.id)+'">Edit</button><button class="btn" data-publish="'+esc(a.id)+'">'+(a.published?"Unpublish":"Publish")+'</button><button class="btn danger" data-delete="'+esc(a.id)+'">Delete</button></div></article>').join(""):'<p class="sub">No apps yet. Use Add App to create your first app.</p>';
list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>location.href="edit-app.html?id="+encodeURIComponent(b.dataset.edit));
list.querySelectorAll("[data-publish]").forEach(b=>b.onclick=async()=>{try{await updateDoc(doc(db,APPS_COLLECTION,b.dataset.publish),{published:b.textContent==="Publish",updatedAt:new Date()});await load()}catch(e){alert(e.message)}});
list.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{const a=apps.find(x=>x.id===b.dataset.delete);if(!confirm("Delete "+(a?.name||"this app")+"?"))return;try{await deleteDoc(doc(db,APPS_COLLECTION,b.dataset.delete));await load()}catch(e){alert(e.message)}});
}
onAuthStateChanged(auth,async user=>{try{requireConfiguredAdmin(user);message.hidden=true;panel.hidden=false;load().catch(e=>{message.hidden=false;message.className="notice error";message.textContent=e.message})}catch(e){message.className="notice error";message.textContent=e.message;if(user && e.message.includes("not authorized"))await signOut(auth)}});
</script></body></html>
